name: Tests

on: [ push, pull_request ]

jobs:
  test-mysql:
    strategy:
      fail-fast: false
      matrix:
        php: [ "8.3", "8.4", "8.5" ]
        laravel: [ "12", "13" ]

    name: "MySQL PHP ${{ matrix.php }} Laravel ${{ matrix.laravel }}"
    runs-on: ubuntu-latest
    services:
      database:
        image: mariadb:11.8
        env:
          MYSQL_DATABASE: web
          MYSQL_USER: web
          MYSQL_PASSWORD: web
          MYSQL_ROOT_PASSWORD: root
        ports: [ 3306 ]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer update --with "illuminate/support:^${{ matrix.laravel }}.0" --no-interaction --no-scripts --no-progress --prefer-dist --prefer-stable

      - name: Execute tests
        run: vendor/bin/phpunit
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.database.ports[3306] }}
          DB_DATABASE: web
          DB_USERNAME: web
          DB_PASSWORD: web

  test-sqlite:
    strategy:
      fail-fast: false
      matrix:
        php: [ "8.3", "8.4", "8.5" ]
        laravel: [ "12", "13" ]

    name: "SQLite PHP ${{ matrix.php }} Laravel ${{ matrix.laravel }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer update --with "illuminate/support:^${{ matrix.laravel }}.0" --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Execute tests
        run: vendor/bin/phpunit
